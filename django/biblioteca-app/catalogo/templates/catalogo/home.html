<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
</head>
<body>
    <h1>Inicio</h1>
    <p>Bienvenido {{user.username}} a la Aplicacion.</p>
    <p>Explora nuestra colección de libros y encuentra tu próxima lectura.</p>
    <h2>Menu Principal</h2>
    <ul>
        <li><a href="{% url 'libro_list' %}">Ver Lista de Libros</a></li>
        <li><a href="{% url 'autor_list' %}">Ver Lista de Autores</a></li>
        <li><a href="{% url 'categoria_list' %}">Lista de Categorías</a></li>
    </ul>
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Cerrar Sesión</button>
    </form>
</body>
</html>
